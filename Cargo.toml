[package]
name = "courses-cli"
version = "0.1.0"
edition = "2021"
authors = ["Courses CLI Contributors"]
description = "Do your grocery shopping at French drives (Carrefour, E.Leclerc and more) from your terminal"
license = "MIT"
repository = "https://github.com/misnard/courses-cli"
homepage = "https://github.com/misnard/courses-cli"
documentation = "https://github.com/misnard/courses-cli#readme"
readme = "README.md"
keywords = ["cli", "groceries", "shopping", "drive", "france"]
categories = ["command-line-utilities"]
exclude = ["*.har", ".claude/", "CONCEPTION.md", "PLAN.md"]

[[bin]]
name = "courses"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Requests run inside a real Chrome, driven over CDP (Cloudflare bypass)
tungstenite = "0.30"
url = "2"

# Endpoint specs embedded in the binary
include_dir = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Config file path
dirs = "6"

# Pretty output
colored = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
