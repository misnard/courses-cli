[package]
name = "carrefour-cli"
version = "0.1.0"
edition = "2021"
authors = ["Carrefour CLI Contributors"]
description = "A command-line interface to shop at Carrefour (French supermarket) from your terminal"
license = "MIT"
repository = "https://github.com/misnard/rs-carrefour-cli"
homepage = "https://github.com/misnard/rs-carrefour-cli"
documentation = "https://github.com/misnard/rs-carrefour-cli#readme"
readme = "README.md"
keywords = ["cli", "carrefour", "shopping", "grocery", "france"]
categories = ["command-line-utilities"]
exclude = ["*.har", ".claude/", "CONCEPTION.md", "PLAN.md"]

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Requests run inside a real Chrome, driven over CDP (Cloudflare bypass)
tungstenite = "0.30"
url = "2"

# Endpoint specs embedded in the binary
include_dir = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Config file path
dirs = "6"

# Pretty output
colored = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
